<style>
  :root{
    /* Bảng "Warm Minimalist" — Nội Thất Đại Thiên */
    --terra:#C89F82;                                   /* đất nung nhạt (trang trí) */
    --orange:#D2661F;--orange-d:#B5531A;--orange-l:#F7E6D8; /* CAM signature (nút/điểm nhấn) */
    --sage:#A3B18A;--sage-d:#7E8C66;                   /* xanh sage (phụ trợ) */
    --ink:#2E342B;--ink2:#3D453A;--muted:#8C857A;      /* xanh than (chữ/header/footer) */
    --green:#366336;
    --line:#E8E0D4;--line2:#D9CFBF;--bg:#F5EFE6;--panel:#FFFFFF;--cream:#FAF5EC;--cotton:#F8F8F8;
    --ok:#4F7A4F;--warn:#B6791F;--sale:#B23A2A;--gold:#9AA87E;--gold-d:#7E8C66;--zalo:#0068FF;
    --ui:'Be Vietnam Pro',system-ui,sans-serif;--disp:'Montserrat',system-ui,sans-serif;
    --r:9px;--r-sm:6px;--shadow:0 1px 2px rgba(46,52,43,.05),0 16px 38px rgba(46,52,43,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  a{color:inherit}
  h2{font-family:var(--disp);font-size:20px;margin:0 0 14px}
  h3{margin:0 0 12px;font-size:15px}

  /* ---------- APP BAR (gộp topbar + subnav thành 1 khối sticky) ---------- */
  .appbar{position:sticky;top:0;z-index:40}
  .topbar{background:var(--ink);color:#fff;border-bottom:1px solid rgba(163,177,138,.45)}
  .topbar .in{max-width:1200px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:13px;cursor:pointer;flex:none;min-width:0}
  .blogo{width:44px;height:44px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.02em;color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 4px 14px rgba(210,102,31,.34)}
  .bnames{min-width:0;display:flex;flex-direction:column}
  .bnames b{font-family:var(--disp);font-size:18px;font-weight:700;line-height:1.12;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bnames .sub{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .rightnav{display:flex;align-items:center;gap:12px;flex:none}
  .areas{display:flex;gap:3px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px}
  .area{border:0;background:transparent;color:#CFC5BA;padding:9px 17px;border-radius:5px;font-weight:600;cursor:pointer;font-size:12.5px;letter-spacing:.02em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .area:hover{color:#fff}
  .area[aria-pressed="true"]{background:var(--orange);color:#fff}
  .topact{display:flex;gap:8px;align-items:center}
  .topact button,.topact a{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;border-radius:9px;padding:9px 13px;font-weight:600;cursor:pointer;font-size:12.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .topact button:hover,.topact a:hover{background:rgba(255,255,255,.16)}
  .topact #btnCart{background:var(--orange);border-color:var(--orange);font-weight:700;padding:9px 16px}
  .topact #btnCart:hover{background:var(--orange-d)}
  .userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:22px;padding:5px 7px 5px 13px;font-size:12.5px;font-weight:600}
  .userchip .av{width:27px;height:27px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  /* ô tìm kiếm ở giữa header (kiểu MOHO) */
  .hsearch{flex:1;max-width:600px;margin:0 22px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:11px;padding:0 6px 0 14px;height:44px}
  .hsearch>svg{color:var(--muted);flex:none}
  .hsearch input{flex:1;border:0;outline:none;background:none;font-size:14.5px;color:var(--ink);min-width:0}
  .hsearch .hsbtn{background:var(--orange);color:#fff;border:0;border-radius:8px;width:38px;height:34px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  .hsearch .hsbtn:hover{background:var(--orange-d)}
  /* thanh menu danh mục (chỉ hiện ở trang khách) */
  .shopnav{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
  body:not(.shopping) .shopnav{display:none}
  .shopnav .in{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:2px}
  .navbtn{border:0;background:none;padding:13px 15px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;line-height:1.2}
  .navbtn:hover{color:var(--orange-d)}
  .navbtn .chev{transition:transform .16s}
  .nb-main{font-weight:700}
  .navright{margin-left:auto;display:flex;align-items:center;gap:2px}
  .nb-hot b{font-weight:700}
  .nb-zalo{color:var(--zalo)}
  .navdrop{position:relative}
  .navdrop:hover .chev{transform:rotate(180deg)}
  .navmenu{position:absolute;top:100%;left:0;min-width:250px;background:#fff;border:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 14px 34px rgba(0,0,0,.13);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:.16s;z-index:45}
  .navdrop:hover .navmenu,.navmenu:hover{opacity:1;visibility:visible;transform:none}
  .navmenu a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
  .navmenu a:hover{background:var(--cream);color:var(--orange-d)}
  .navmenu a .ct{color:var(--muted);font-size:12px;font-weight:400}

  /* sub nav (admin tabs) */
  .subnav{background:var(--cream);border-bottom:1px solid var(--line)}
  .subnav .in{max-width:1200px;margin:0 auto;padding:6px 20px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .tab{border:0;background:transparent;padding:9px 15px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13.5px}
  .tab[aria-pressed="true"]{background:var(--ink);color:#fff}
  .tab:hover{color:var(--ink)}

  /* phần tử chỉ hiện trên điện thoại — mặc định ẩn */
  .hamb,.micon,.msearch{display:none}
  .drawer-ov{position:fixed;inset:0;background:rgba(20,16,12,.5);z-index:55;opacity:0;pointer-events:none;transition:.2s}
  .drawer-ov.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:330px;background:#fff;z-index:56;transform:translateX(-100%);transition:transform .25s;overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .drawer.show{transform:none}
  .drawer-body{padding:0}
  .dw-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .dw-head .blogo{width:34px;height:34px;font-size:13px;border-radius:8px}
  .dw-head .x{border:0;background:rgba(0,0,0,.05);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
  .dw-sect{padding:8px 0;border-bottom:1px solid var(--line)}
  .dw-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 18px 4px}
  .dw-sect button,.dw-sect a{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:11px 18px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none}
  .dw-sect button:hover,.dw-sect a:hover{background:var(--cream)}
  .dw-sect svg.ico{color:var(--orange-d);flex:none}

  @media (max-width:760px){
    .topbar .in{flex-wrap:wrap;gap:11px}
    .bnames b{font-size:16px}
    .rightnav{order:3;width:100%;justify-content:space-between}
  }
  /* ===== ĐẦU TRANG KIỂU MOHO TRÊN ĐIỆN THOẠI ===== */
  @media (max-width:640px){
    body.shopping .annbar{display:none} /* bỏ thanh thông báo trên điện thoại */
    .hamb{display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;padding:4px;cursor:pointer;flex:none}
    .topbar .in{flex-wrap:nowrap;gap:10px;padding:9px 14px;align-items:center;justify-content:space-between}
    .brand{position:absolute;left:50%;transform:translateX(-50%);gap:8px}
    .bnames{display:none} /* chỉ hiện logo ở giữa, bỏ tên để gọn (như MOHO) */
    .blogo{width:38px;height:38px;font-size:15px;border-radius:9px}
    #brandLogo{height:36px;max-width:150px}
    .spacer{display:none}
    .rightnav{order:0;width:auto;gap:8px;align-items:center}
    .areas{display:none}
    .micon{display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;padding:4px;cursor:pointer}
    .topact{gap:6px}
    .topact #btnCart{padding:8px;min-width:0;border-radius:9px}
    .topact #btnCart .lbl{display:none} /* ẩn chữ "Giỏ", chỉ icon */
    .topact #btnCart .cbadge{position:absolute;top:-5px;right:-5px;margin:0}
    .userchip .av{margin:0}
    body.shopping .msearch{display:block;background:#fff;border-bottom:1px solid var(--line)}
    .msearch .in{max-width:1200px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:9px;color:var(--muted)}
    .msearch input{flex:1;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font-size:14px;background:var(--cream);outline:none}
    .searchbar{display:none} /* ẩn ô tìm trong trang vì đã có ở header */
    .hsearch{display:none} /* điện thoại dùng ô tìm ở hàng dưới (.msearch) */
    .shopnav{display:none!important} /* điện thoại dùng menu drawer (nút ☰) */
  }
  .wrap{max-width:1200px;margin:0 auto;padding:22px 18px 70px}

  /* ---------- CARDS / FORM ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:var(--orange)}
  textarea{resize:vertical;min-height:54px}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:90px}
  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
  .btn{border:1px solid var(--orange);background:var(--orange);color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;width:100%}
  .btn:hover{background:var(--orange-d);border-color:var(--orange-d)}
  .btn.alt{background:#fff;color:var(--ink);border-color:var(--line2)}
  .btn.alt:hover{background:var(--cream)}
  .btn.dark{background:var(--ink);border-color:var(--ink)}
  .btn.sm{width:auto;padding:7px 12px;font-size:12.5px}
  .btn.danger{background:#fff;color:var(--sale);border-color:var(--sale)}
  .btn.danger:hover{background:#FBEEEC}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.low td{background:#FBEFEC}
  .right{text-align:right}.muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.ban{background:#E9F0F8;color:var(--zalo)}.pill.nhap{background:#EAF3EE;color:var(--ok)}.pill.xuat{background:var(--orange-l);color:var(--orange-d)}
  .pill.cho{background:#FFF3D9;color:var(--warn)}.pill.xong{background:#EAF3EE;color:var(--ok)}.pill.huy{background:#F4E3E0;color:var(--sale)}
  .line-item{display:grid;grid-template-columns:1fr 60px 110px 28px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line)}
  .line-item .x{border:0;background:none;color:var(--sale);font-weight:800;cursor:pointer;font-size:16px}
  .tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  /* ===== POS (Bán hàng tại quầy) ===== */
  .bangrid{grid-template-columns:1.2fr 1fr}
  .possearch{position:relative;display:flex;align-items:center;gap:9px;border:1.5px solid var(--orange-l);border-radius:11px;padding:0 12px;background:var(--cream)}
  .possearch:focus-within{border-color:var(--orange)}
  .possearch .ps-ic{color:var(--muted);display:flex;flex:none}
  .possearch input{flex:1;border:0;outline:none;background:none;padding:13px 0;font-size:15px;color:var(--ink);min-width:0}
  .possug{position:absolute;top:calc(100% + 5px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 34px rgba(0,0,0,.14);max-height:320px;overflow:auto;z-index:30;display:none;padding:6px}
  .possug.show{display:block}
  .sug-it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer}
  .sug-it:hover{background:var(--cream)}
  .posline{padding:11px 0;border-bottom:1px solid var(--line)}
  .posline.low{background:#FCF3F1;border-radius:8px;padding:10px}
  .pl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .pl-name{min-width:0;flex:1 1 auto}.pl-name b{font-size:14px;line-height:1.3}.pl-name .muted{font-size:11.5px;display:block;margin-top:1px}
  .pl-ctrl{display:grid;grid-template-columns:1.1fr .7fr 1fr 1.1fr;gap:10px;align-items:end}
  .pl-f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pl-f label{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
  .pl-f input{border:1px solid var(--line2);border-radius:7px;padding:8px;font-size:13px;width:100%;text-align:right;font-variant-numeric:tabular-nums;background:#fff}
  .pl-f input.pl-disc{text-align:left}
  .pl-price{font-weight:600;font-size:14px;padding:8px 0;text-align:right;font-variant-numeric:tabular-nums}
  .pl-lt{font-weight:800;font-size:15px;padding:8px 0;text-align:right;font-variant-numeric:tabular-nums;color:var(--orange-d)}
  .posline .x{border:0;background:none;color:var(--sale);font-weight:800;cursor:pointer;font-size:20px;line-height:1;flex:none}
  .postot{margin-top:16px;border-top:2px solid var(--orange-l);padding-top:12px}
  .postot .r{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0;color:var(--ink)}
  .postot .r span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
  .postot .r.grand{font-size:19px;font-weight:800;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line2)}
  .postot .r.grand span:last-child{color:var(--orange-d)}
  .postot .r.grand.remain span:last-child{color:var(--sale)}
  @media(max-width:760px){.bangrid{grid-template-columns:1fr}.pl-ctrl{grid-template-columns:1fr 1fr}}
  /* ===== Menu con + bộ lọc Kho ===== */
  .khonav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .khonav-b{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
  .khonav-b:hover{border-color:var(--orange)}
  .khonav-b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .khofilter{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 16px;padding:12px;background:var(--cream);border-radius:10px}
  .khofilter .f{display:flex;flex-direction:column;gap:4px}
  .khofilter .f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
  .khofilter select,.khofilter input{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13.5px;background:#fff}
  @media(max-width:640px){.khofilter .f{flex:1 1 45%}}
  /* ===== Khách hàng ===== */
  .khrow{border-bottom:1px solid var(--line);padding:12px 0}
  .khrow:last-child{border-bottom:0}
  .kh-main{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .kh-stat{display:flex;flex-direction:column;gap:2px;min-width:88px;flex:none}
  .kh-stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
  .kh-stat b{font-size:14px;font-variant-numeric:tabular-nums}

  /* ---------- LOGIN ---------- */
  .login{max-width:420px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 28px;text-align:center}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:90}

  /* logo ở header */

  .gdmini p{font-size:11.5px!important;line-height:1.5;margin-bottom:13px!important}

  /* ===== BADGE SẢN PHẨM (trang khách) ===== */
  .pbadges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}

  .pbadges.big{gap:7px;margin:0 0 12px}.pbadges.big .pbadge{font-size:12px;padding:5px 12px}
  /* ===== TEM & NHÃN SẢN PHẨM ===== */
  .lblbar{display:flex;gap:6px;background:#F1ECE4;border-radius:11px;padding:5px;margin-bottom:16px;max-width:520px}
  .lblbar button{flex:1;padding:9px 6px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted)}
  .lblbar button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .lblsheet{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  .nttag{width:300px;background:#FCFBF8;border:1px solid var(--line);border-radius:14px;position:relative;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box}
  .nttag-in{padding:4mm 5mm;flex:1;min-height:0;display:flex;flex-direction:column}
  .nt-body{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .nttag .corner{position:absolute;top:16px;right:-36px;width:132px;text-align:center;transform:rotate(45deg);color:#fff;font-weight:800;font-size:9.5px;letter-spacing:.08em;padding:4px 0;text-transform:uppercase;background:var(--warn);z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .nttag .corner.hot{background:var(--sale)}
  .nt-eyebrow{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .nt-eyebrow .bar{width:22px;height:2px;background:var(--orange)}
  .nt-name{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.15;margin:4px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nt-sku{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:8px}.nt-sku b{color:var(--ink)}
  .nt-flag{font-size:8px;font-weight:800;letter-spacing:.02em;color:var(--sale);background:#F7DED9;border-radius:20px;padding:2px 8px;white-space:nowrap;text-transform:uppercase;flex:none}
  .nt-ledger{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .nt-lrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2.5px 0;font-size:12.5px;line-height:1.25;border-bottom:1px dotted var(--line)}
  .nt-lrow:last-child{border-bottom:0}
  .nt-lrow .k{color:var(--muted);flex:none}
  .nt-lrow .v{flex:1;min-width:0;text-align:right;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nt-custom{margin-top:6px;font-size:9.5px;font-weight:700;color:var(--orange-d);background:var(--orange-l);border:1px dashed var(--orange);border-radius:6px;padding:3px 8px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .nt-price{flex:none;margin-top:6px;padding-top:7px;border-top:1.5px solid var(--orange-l);display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .nt-pl{min-width:0}
  .nt-price .lab{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-d)}
  .nt-nowline{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .nt-now{font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1.05;color:var(--orange);font-variant-numeric:tabular-nums}
  .nt-old{font-size:12px;text-decoration:line-through;color:#9a948a}
  .ntqr{width:50px;height:50px;flex:none;border:1px solid var(--line);border-radius:7px;padding:3px;background:#fff}
  .ntqr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges;image-rendering:crisp-edges}
  .ntqr-cap{font-size:7.5px;text-align:center;color:var(--muted);margin-top:2px}
  /* KHỔ THẺ CỐ ĐỊNH (không phụ thuộc nội dung) — xếp khít trên A4:
     Nhỏ 93×68mm = 8 thẻ/A4 (2 cột × 4 hàng). To 186×68mm = gấp đôi (1 to = chỗ của 2 nhỏ). */
  .nttag.sz-sm{width:93mm;height:68mm}
  /* Tem nhỏ: giá + QR chiếm hết phần dưới, căn giữa dọc để không bị khoảng trống lớn; chữ giá to hơn */
  .nttag.sz-sm .nt-body{flex:0 0 auto}
  .nttag.sz-sm .nt-price{flex:1 1 auto;align-items:center;margin-top:4px}
  .nttag.sz-sm .nt-price .lab{font-size:10px}
  .nttag.sz-sm .nt-now{font-size:30px}
  .nttag.sz-sm .ntqr{width:52px;height:52px}
  .nttag.sz-sm .ntqr-cap{font-size:8px}
  /* Nhãn TO = dạng DỌC, cao gấp đôi nhỏ (93×136mm), cùng cột 93mm để xếp gọn; chữ to hơn nhỏ */
  .nttag.sz-lg{width:93mm;height:136mm}
  .nttag.sz-lg .nttag-in{padding:5mm 5.5mm}
  .nttag.sz-lg .nt-eyebrow{font-size:11px;margin-bottom:3px}
  .nttag.sz-lg .nt-name{font-size:25px;line-height:1.15;margin:9px 0 3px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nttag.sz-lg .nt-sku{font-size:14px;margin-bottom:11px}
  .nttag.sz-lg .nt-lrow{font-size:15px;padding:6px 0}
  .nttag.sz-lg .nt-custom{font-size:12px;padding:7px 12px;margin-top:11px}
  .nttag.sz-lg .nt-body{flex:0 0 auto}
  /* Đáy nhãn dọc: giá + QR thành 1 cụm CĂN GIỮA, lấp khoảng trống, xếp dọc (không đè nhau) */
  .nttag.sz-lg .nt-price{flex:1 1 auto;min-height:0;margin-top:14px;padding-top:16px;border-top:1.5px solid var(--orange-l);
    flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .nttag.sz-lg .nt-pl{align-items:center;text-align:center}
  .nttag.sz-lg .nt-nowline{justify-content:center}
  .nttag.sz-lg .nt-price .lab{font-size:11px;margin-bottom:2px}
  .nttag.sz-lg .nt-now{font-size:35px;line-height:1}
  .nttag.sz-lg .nt-old{font-size:16px}
  .nttag.sz-lg .ntqr{width:94px;height:94px;padding:5px}
  .nttag.sz-lg .ntqr-cap{font-size:9.5px;margin-top:3px}
  .ntstk{width:230px;position:relative;border-radius:16px;color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.18)}
  .ntstk-sale{background:radial-gradient(circle at 30% 0%,#C8341D 0%,#9E2412 100%);padding:20px 18px 16px;text-align:center;border-radius:16px}
  .ntstk .head{font-weight:900;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
  .ntstk .apply{font-size:11px;opacity:.92;margin-top:3px;font-weight:600}
  .ntburst{position:absolute;top:-14px;right:-12px;width:80px;height:80px;border-radius:50%;background:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#241E1A;transform:rotate(8deg);box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .ntburst .pct{font-weight:900;font-size:23px;line-height:.9;letter-spacing:-.02em}
  .ntburst .lab{font-weight:800;font-size:9px;letter-spacing:.1em}
  .ntstk-sale .old{margin-top:16px;font-size:14px;text-decoration:line-through;opacity:.85;font-variant-numeric:tabular-nums}
  .ntstk-sale .new{font-weight:900;font-size:33px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ntstk-sale .save{display:inline-block;margin-top:12px;background:var(--gold);color:#241E1A;font-weight:900;font-size:13px;padding:6px 14px;border-radius:30px}
  .ntstk-sale .scar{margin-top:12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.22);padding:7px;border-radius:9px}
  /* Sticker SALE — khổ CỐ ĐỊNH 93×66mm để xếp KHÍT 8 tem/trang A4 (2 cột × 4 hàng), vẫn to nổi bật */
  .saleL{width:93mm;height:66mm;overflow:hidden;border-radius:14px}
  .saleL .ntstk-sale{height:100%;box-sizing:border-box;padding:5mm 6mm;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:0}
  .saleL .head{font-size:16px;letter-spacing:.2em}
  .saleL .apply{font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .saleL .old{font-size:14px;margin-top:8px}
  .saleL .new{font-size:42px}
  .saleL .save{font-size:13px;padding:6px 15px;margin-top:9px}
  .saleL .scar{font-size:11px;margin-top:9px;padding:6px 8px}
  .saleL .ntburst{width:76px;height:76px;top:5px;right:5px}
  .saleL .ntburst .pct{font-size:22px}
  .saleL .ntburst .lab{font-size:9px}
  .ntstk-gift{background:radial-gradient(circle at 30% 0%,#2E7D52 0%,#1B5E3A 100%);padding:20px 18px 18px;text-align:center;border-radius:16px}
  .ntstk-gift .ic{font-size:36px;line-height:1}
  .ntstk-gift .head{font-weight:900;font-size:17px;letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
  .ntstk-gift .free{font-weight:800;font-size:11px;letter-spacing:.2em;opacity:.92;margin-top:1px}
  .ntstk-gift .gname{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.2;margin:13px 8px 0}
  .ntstk-gift .gval{display:inline-block;margin-top:12px;background:var(--gold);color:#241E1A;font-weight:900;font-size:14px;padding:7px 16px;border-radius:30px}
  .ntstk-gift .gval small{font-weight:700;font-size:10px;display:block;letter-spacing:.05em}
  .ntstk-gift .cond{margin-top:13px;font-size:11px;font-weight:700;background:rgba(0,0,0,.2);padding:8px 10px;border-radius:9px;line-height:1.35}
  /* ===== TEM TỰ TÔ (LED 7 đoạn) — khổ CỐ ĐỊNH 93×66mm để 8 tem lấp đầy A4 (2×4) ===== */
  .ntpromo{width:93mm;height:66mm;background:#fff;color:var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.14)}
  .ntpromo-in{height:100%;box-sizing:border-box;border:2px solid var(--sale);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .ntpromo .pmhead{background:var(--sale);color:#fff;font-weight:900;font-size:21px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:7px 8px;flex:none;white-space:nowrap;overflow:hidden}
  .ntpromo .seg7row{flex:1;display:flex;align-items:center;justify-content:center;gap:2.5mm;padding:2mm 4mm;min-height:0}
  .ntpromo .seg7cell{display:block}
  .seg7{width:var(--dw,12.5mm);height:calc(var(--dw,12.5mm)*2.08);display:block}
  .seg7 .sg{fill:#E4DDCE;stroke:#D3C9B4;stroke-width:.6}
  .ntpromo .seg7dot{align-self:flex-end;font-weight:900;font-size:30px;line-height:1;color:#E4DDCE;margin:0 -1mm 3mm}
  .ntpromo .seg7suf{align-self:flex-end;font-weight:900;font-size:28px;color:var(--sale);margin-bottom:3mm;margin-left:1mm}
  .gfitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13px}
  .gfitem button{border:0;background:none;color:var(--sale);font-weight:800;cursor:pointer;font-size:16px}

  #printArea{display:none}
  @page{size:A4;margin:10mm}
  @media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:0}
    .pv{font-size:13px}.pv h1{font-size:20px;margin:0 0 4px}.pv table{width:100%}.pv th,.pv td{border-bottom:1px solid #999;padding:6px 8px}
    .tags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    /* Nhãn SP: xếp khít, khổ cố định, lề A4 10mm -> vùng in 190×277mm. Nhỏ 93×68 (8/trang), To 186×68 (=2 nhỏ). */
    #printArea .lblsheet{display:flex;flex-wrap:wrap;gap:0;align-content:flex-start}
    .nttag,.ntstk{box-shadow:none!important;break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .nttag *,.ntstk *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* ===== IN RÕ NÉT: ép chữ tem sang tông đậm/đen + nét dày hơn để không bị phai khi in ===== */
    #printArea{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
    .nttag .nt-name{color:#1E1A15!important}
    .nttag .nt-eyebrow,.nttag .nt-sku,.nttag .nt-lrow .k,.nttag .ntqr-cap{color:#3A322A!important}
    .nttag .nt-eyebrow{font-weight:800!important}
    .nttag .nt-sku,.nttag .nt-lrow .k,.nttag .ntqr-cap{font-weight:700!important}
    .nttag .nt-lrow .v{color:#1E1A15!important;font-weight:700!important}
    .nttag .nt-old{color:#544D45!important}
    .nttag .nt-sku b{color:#1E1A15!important}
    /* đường kẻ đậm & liền nét (kẻ chấm nhạt in ra hay đứt/mờ) */
    .nttag .nt-ledger{border-color:#8F8676!important}
    .nttag .nt-lrow{border-bottom:1px solid #C0B6A4!important}
    .nttag .nt-lrow:last-child{border-bottom:0!important}
    .nttag .nt-eyebrow .bar{height:2.5px!important}
    .nttag{border:1px solid #bbb;border-radius:0}
    .nttag.sz-sm{width:93mm;height:68mm}
    .nttag.sz-lg{width:93mm;height:136mm}
    .ntstk{width:60mm}
    .saleL{width:93mm;height:66mm}
    .ntpromo{width:93mm;height:66mm}}
  @media (max-width:860px){.grid2{grid-template-columns:1fr}.stat{grid-template-columns:1fr 1fr}
    .trust{grid-template-columns:1fr 1fr}.hero{padding:38px 28px;min-height:240px}.hero h1{font-size:31px}.hero::after{font-size:140px}

    .wrap{padding:16px 13px 54px}

    .pprice{margin:7px 0 3px;gap:6px}.pprice .now{font-size:15px}.pprice .old{font-size:11px}
    .psold{font-size:10px;margin-bottom:9px}
    .buy{padding:9px 6px;font-size:10px;letter-spacing:.06em}

    /* hero */
    .hero{padding:26px 20px;min-height:188px;border-radius:12px;margin-bottom:26px}

<script>
/* ====================== HÀM CHUNG ====================== */
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n||0))+'đ';
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseInt(String(v).replace(/[^\d]/g,''),10);return isNaN(n)?0:n;};
// Số lượng thập phân (m²): nhận cả dấu "." và "," — vd "2,4" hoặc "2.4"
const numDec=v=>{const m=String(v).replace(',','.').match(/\d+(?:\.\d+)?/);return m?parseFloat(m[0]):0;};
const fmtQty=q=>{const n=Math.round((+q||0)*1000)/1000;return String(n).replace('.',',');};
// SP bán theo diện tích/dài (đơn giá theo m²…) → cho nhập số lượng lẻ
function allowDecQty(p){return !!(p&&(p.byArea|| /m²|m2|mét|met vuong/i.test(p.unit||'')));}
// Đọc SL từ ô nhập, tôn trọng loại SP (lẻ hay nguyên). Luôn parse thập phân để "1,62" KHÔNG bao giờ thành 162.
function readQty(p,val){const q=numDec(val);return allowDecQty(p)?Math.max(0,q):Math.max(1,Math.round(q));}
// Làm tròn tiền về hàng chục (đồng) cho tổng đơn
const round10=n=>Math.round((+n||0)/10)*10;
const initials=s=>((s||'?').trim().split(/\s+/)[0]||'?').slice(0,1).toUpperCase();
const brandMark=s=>{const w=(s||'').trim().split(/\s+/).filter(Boolean);if(!w.length)return 'ĐT';return w.slice(-2).map(x=>x[0]).join('').toUpperCase();};
const noDia=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d');
const makeUsername=s=>noDia(s).toLowerCase().replace(/[^a-z0-9]/g,'')||('nv'+Math.random().toString(36).slice(2,6));
async function hashPass(s){
  if(!s)return '';
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('daithien$'+s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  catch(e){return 'plain:'+s;} // dự phòng nếu trình duyệt cũ không hỗ trợ
}
async function checkPass(input,s){
  if(!s)return false;
  if(s.passHash){return (await hashPass(input))===s.passHash;}
  if(s.pin!=null){return String(input)===String(s.pin);} // tài khoản cũ (PIN) — tương thích ngược
  return false;
}

function closeDlg(){$('#dlg').classList.remove('show');}
function uiPrompt({title,label='',value='',type='text',ok='OK',placeholder=''}){
  return new Promise(res=>{
    $('#dlgContent').innerHTML=`<div class="mbody"><h2 style="font-size:19px;margin-bottom:12px">${esc(title)}</h2>
      ${label?`<label>${esc(label)}</label>`:''}

      <div class="row" style="margin-top:16px"><button class="btn" id="_dOk">${esc(ok)}</button><button class="btn alt" id="_dCancel" style="flex:0 0 96px">Hủy</button></div></div>`;
    $('#dlg').classList.add('show');
    const inp=$('#_dIn');setTimeout(()=>inp.focus(),30);
    const done=v=>{closeDlg();res(v);};
    $('#_dOk').onclick=()=>done(inp.value);
    $('#_dCancel').onclick=()=>done(null);
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done(inp.value);}if(e.key==='Escape')done(null);};
  });
}
function uiConfirm(title,msg='',ok='Xóa'){
  return new Promise(res=>{
    $('#dlgContent').innerHTML=`<div class="mbody"><h2 style="font-size:19px;margin-bottom:8px">${esc(title)}</h2>

    $('#dlg').classList.add('show');
    $('#_dOk').onclick=()=>{closeDlg();res(true);};
    $('#_dCancel').onclick=()=>{closeDlg();res(false);};
  });
}

/* ====================== LƯU TRỮ (Supabase nếu có cấu hình, ngược lại localStorage) ====================== */
const DB=(()=>{
  let sb=null, useSupa=false;
  const mem={}; let hasLS=false;
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');hasLS=true;}catch(e){}
  const lsGet=k=>{if(hasLS){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){}}return (k in mem)?mem[k]:null;};
  const lsSet=(k,val)=>{if(hasLS){try{localStorage.setItem(k,JSON.stringify(val));return;}catch(e){}}mem[k]=val;};
  const remote=k=>useSupa&&!LOCAL_KEYS.includes(k);
  return {
    async init(){
      if(SUPA_URL&&SUPA_KEY&&window.supabase&&window.supabase.createClient){
        try{sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);useSupa=true;console.log('✅ Supabase đã kết nối');}
        catch(e){useSupa=false;console.warn('Supabase init lỗi, dùng localStorage:',e);}
      }
    },
    get supaOn(){return useSupa;},
    client(){return sb;},
    async get(k){
      if(remote(k)){
        try{const {data,error}=await sb.from('kv').select('value').eq('key',k).maybeSingle();if(error)throw error;return data?data.value:null;}
        catch(e){console.warn('Supabase get lỗi ('+k+'):',e.message||e);return lsGet(k);}
      }
      return lsGet(k);
    },
    async set(k,val){
      if(remote(k)){
        try{const {error}=await sb.from('kv').upsert({key:k,value:val,updated_at:new Date().toISOString()},{onConflict:'key'});if(error)throw error;lsSet(k,val);return;}
        catch(e){console.warn('Supabase set lỗi ('+k+'):',e.message||e);lsSet(k,val);return;}
      }
      lsSet(k,val);
    },
    /* ----- Xác thực (Supabase Auth) ----- */
    async currentEmail(){if(!useSupa)return null;try{const {data}=await sb.auth.getUser();return data&&data.user?data.user.email:null;}catch(e){return null;}},
    async signIn(email,password){if(!useSupa)return{error:{message:'Chưa kết nối máy chủ'}};return await sb.auth.signInWithPassword({email,password});},
    async signOut(){if(useSupa){try{await sb.auth.signOut();}catch(e){}}},
    async updatePassword(password){if(!useSupa)return{error:{message:'Chưa kết nối'}};return await sb.auth.updateUser({password});},
    // Tạo tài khoản nhân viên KHÔNG làm rớt phiên của chủ (dùng client tạm, không lưu phiên)
    async signUpAux(email,password){

      try{const tmp=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'sb-aux'}});
        const r=await tmp.auth.signUp({email,password});return r;}
      catch(e){return{error:{message:e.message||String(e)}};}
    },
    // Tài khoản chủ đầu tiên: signUp trên client chính (để đăng nhập luôn)
    async signUpPrimary(email,password){if(!useSupa)return{error:{message:'Chưa kết nối'}};return await sb.auth.signUp({email,password});}
  };
})();

/* ---- Danh bạ khách hàng: sửa ở đây thì mọi đơn cũ hiện theo thông tin mới ---- */
function noAccent(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').trim();}
function phoneKey(p){return (p||'').replace(/\D/g,'');}
function nameKey(n){return (n||'').trim().toLowerCase().replace(/\s+/g,' ');}
// nhận diện khách: ưu tiên SĐT, không có thì theo TÊN
function custKey(b){b=b||{};const p=phoneKey(b.phone);if(p)return 'p:'+p;const n=nameKey(b.name);return n?'n:'+n:'';}
function findCustByKey(k){return k?customers.find(c=>custKey(c)===k)||null:null;}
function findCust(phone){return findCustByKey('p:'+phoneKey(phone));}
function resolveBuyer(b){b=b||{};const c=findCustByKey(custKey(b));
  return {name:(c&&c.name)||b.name||'',phone:(c&&c.phone)||b.phone||'',address:(c&&c.address)||b.address||''};}
// ghi thông tin khách mới vào TẤT CẢ đơn cũ của khách đó (giữ liên kết khi đổi SĐT)
async function applyCustomerToOrders(oldKey,cust){
  if(!oldKey)return;const list=await loadAllOrders();let touched=false;
  for(const no of list){
    if(custKey(no.buyer)!==oldKey)continue;
    const nb=Object.assign({},no.buyer,{name:cust.name,phone:cust.phone,address:cust.address});
    if(no.store==='online'){try{await DB.client().from('orders').update({buyer:nb}).eq('id',no.id);}catch(e){}}
    else{no.raw.buyer=nb;touched=true;}
  }
  if(touched)await saveV();
}

const sellPrice=p=>{

    if(cv){const v=findVar(p,cv.color,cv.size);if(v&&+v.price>0)return varSell(v);}

  }
  return (p.salePrice&&p.salePrice<p.price)?p.salePrice:p.price;
};

/* ====================== SEO / GEO (meta động + dữ liệu có cấu trúc) ====================== */
function setMeta(key,val,attr){attr=attr||'name';let el=document.head.querySelector('meta['+attr+'="'+key+'"]');if(!el){el=document.createElement('meta');el.setAttribute(attr,key);document.head.appendChild(el);}el.setAttribute('content',val||'');}
function setLink(rel,href){let el=document.head.querySelector('link[rel="'+rel+'"]');if(!el){el=document.createElement('link');el.setAttribute('rel',rel);document.head.appendChild(el);}el.setAttribute('href',href);}
function setJsonLd(obj){let el=document.getElementById('jsonld');if(!el){el=document.createElement('script');el.id='jsonld';el.type='application/ld+json';document.head.appendChild(el);}el.textContent=JSON.stringify(obj);}
function catSlug(s){return (noAccent(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''))||'muc';}
function applySEO(p){
  const base=location.origin+location.pathname;
  if(p){
    // canonical = URL tĩnh đẹp /sp/<id>/ (khớp trang prerender) — 1 địa chỉ chính thức duy nhất
    const url=location.origin+'/sp/'+encodeURIComponent(p.id)+'/';
    const title=p.name+' · '+(settings.shop||'Nội Thất Đại Thiên');
    const desc=(p.desc||(p.name+' - '+(prodCat(p)||'nội thất')+' chính hãng tại '+(settings.shop||'')+'. '+(settings.address||''))).replace(/\s+/g,' ').trim().slice(0,160);
    setMeta('robots','index,follow');
    document.title=title;setMeta('description',desc);
    setMeta('og:title',title,'property');setMeta('og:description',desc,'property');setMeta('og:type','product','property');setMeta('og:url',url,'property');setMeta('og:site_name',settings.shop,'property');
    if(p.images&&p.images[0])setMeta('og:image',p.images[0],'property');
    setMeta('twitter:card','summary_large_image');setLink('canonical',url);
    setJsonLd({"@context":"https://schema.org/","@type":"Product",name:p.name,image:(p.images||[]).slice(0,6),description:desc,sku:p.sku||undefined,category:prodCat(p)||undefined,brand:{"@type":"Brand",name:settings.shop},offers:{"@type":"Offer",url:url,priceCurrency:"VND",price:String(sellPrice(p)),availability:stockState(p).avail?"https://schema.org/InStock":"https://schema.org/OutOfStock",seller:{"@type":"Organization",name:settings.shop}}});
  }else{
    const shop=settings.shop||'Nội Thất Đại Thiên';const addr=settings.address||'';
    const storeLd=u=>({"@context":"https://schema.org","@type":"FurnitureStore",name:shop,image:settings.logo||undefined,telephone:settings.phone,url:u,priceRange:"$$",address:{"@type":"PostalAddress",streetAddress:addr,addressLocality:"Hải Phòng",addressCountry:"VN"}});
    if(search){
      // TRANG TÌM KIẾM — không cho index (tránh trang mỏng/trùng), vẫn cho bot đi tiếp link
      const url=base+'?tim='+encodeURIComponent(search);
      const title='Tìm "'+search+'" · '+shop;
      const desc=('Kết quả tìm kiếm "'+search+'" tại '+shop+'. '+addr).replace(/\s+/g,' ').trim().slice(0,160);
      setMeta('robots','noindex,follow');
      document.title=title;setMeta('description',desc);
      setMeta('og:title',title,'property');setMeta('og:description',desc,'property');setMeta('og:type','website','property');setMeta('og:url',url,'property');setMeta('og:site_name',shop,'property');
      if(settings.logo)setMeta('og:image',settings.logo,'property');
      setMeta('twitter:card','summary');setLink('canonical',base);
      setJsonLd(storeLd(base));
    }else if(active&&active!=='__all'&&active!=='__none'){
      // TRANG DANH MỤC — mỗi danh mục 1 tiêu đề/mô tả riêng (canonical = /danh-muc/<slug>/)
      const url=location.origin+'/danh-muc/'+catSlug(active)+'/';
      const title=active+' · '+shop;
      const list=products.filter(x=>prodCats(x).includes(active));
      const desc=('Mua '+active+' chính hãng tại '+shop+(addr?', '+addr:'')+'. '+(list.length?list.length+' mẫu, ':'')+'giao lắp tận nơi, bảo hành dài hạn.').replace(/\s+/g,' ').trim().slice(0,160);
      setMeta('robots','index,follow');
      document.title=title;setMeta('description',desc);
      setMeta('og:title',title,'property');setMeta('og:description',desc,'property');setMeta('og:type','website','property');setMeta('og:url',url,'property');setMeta('og:site_name',shop,'property');
      const wImg=(list.find(x=>x.images&&x.images[0])||{}).images;
      setMeta('og:image',(wImg&&wImg[0])||settings.logo||'','property');
      setMeta('twitter:card','summary_large_image');setLink('canonical',url);
      setJsonLd({"@context":"https://schema.org","@type":"CollectionPage",name:title,url:url,about:{"@type":"Organization",name:shop},
        mainEntity:{"@type":"ItemList",numberOfItems:list.length,itemListElement:list.slice(0,24).map((x,i)=>({"@type":"ListItem",position:i+1,url:base+'?p='+x.id,name:x.name}))}});
    }else{
      // TRANG CHỦ
      const url=base;const title=shop;
      const desc=((settings.slogan?settings.slogan+'. ':'')+(settings.note||'')+' '+addr).replace(/\s+/g,' ').trim().slice(0,160);
      setMeta('robots','index,follow');
      document.title=title;setMeta('description',desc);
      setMeta('og:title',title,'property');setMeta('og:description',desc,'property');setMeta('og:type','website','property');setMeta('og:url',url,'property');setMeta('og:site_name',shop,'property');
      if(settings.logo)setMeta('og:image',settings.logo,'property');
      setMeta('twitter:card','summary');setLink('canonical',url);
      setJsonLd(storeLd(url));
    }
  }
}

async function doLogin(email,password){
  if(!email||!password){toast('Nhập email và mật khẩu');return;}
  toast('Đang đăng nhập...');
  const {data,error}=await DB.signIn(email,password);
  if(error){toast(/invalid|credential/i.test(error.message)?'Sai email hoặc mật khẩu':('Lỗi: '+error.message));return;}
  await reloadShared();
  const p=staffByEmail(email);
  if(!p||p.active===false){await DB.signOut();toast('Email này chưa được cấp quyền quản trị');return;}
  session.staff=p;tab='';renderTopAct();renderTabs();renderView();toast('Xin chào '+p.name);
}
async function createOwner(){
  const name=($('#frName').value||'Chủ cửa hàng').trim();
  const email=$('#frEmail').value.trim();const pass=$('#frPass').value;
  if(!/.+@.+\..+/.test(email)){toast('Nhập email hợp lệ');return;}
  if(pass.length<6){toast('Mật khẩu tối thiểu 6 ký tự');return;}
  toast('Đang tạo tài khoản...');
  const {data,error}=await DB.signUpPrimary(email,pass);
  if(error){toast('Lỗi tạo tài khoản: '+error.message);return;}
  if(!data||!data.session){toast('Cần TẮT "Confirm email" trong Supabase rồi thử lại (tài khoản chưa kích hoạt được).');return;}
  const owner={id:uid(),email:email.toLowerCase(),name,role:'Chủ',perms:permObj(ROLE_PRESET['Chủ']),active:true};
  staff=[owner];
  await saveStaff();
  session.staff=owner;tab='';renderTopAct();renderTabs();renderView();toast('Đã tạo tài khoản chủ · Xin chào '+name);
}

function stockState(p){
  const stk=hasVariants(p)?varStockTotal(p):(+p.stock||0);
  if(stk<=0)return{cls:'no',txt:'Hết hàng',avail:false};
  if(stk<=(p.min||0))return{cls:'warn',txt:'Sắp hết',avail:true};
  return{cls:'ok',txt:'Còn hàng',avail:true};
}
function zaloLink(){const z=(settings.zalo||'').trim();if(z)return /^https?:/i.test(z)?z:'https://zalo.me/'+z.replace(/[^\d]/g,'');const ph=(settings.phone||'').replace(/[^\d]/g,'');return ph?'https://zalo.me/'+ph:'#';}
const telLink=()=>'tel:'+(settings.phone||'').replace(/[^\s\d+]/g,'');
function mapRaw(){return (settings.map||'').trim();}
// Ô "địa điểm" nhận: (1) mã nhúng <iframe>, (2) link nhúng maps/embed, (3) toạ độ "lat,lng", (4) link chia sẻ, (5) chữ địa chỉ
function mapCoords(){const m=mapRaw().match(/^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);return m?(m[1]+','+m[2]):'';}
// chỉ coi là "chữ địa chỉ" khi KHÔNG phải iframe / URL / toạ độ
function mapText(){const m=mapRaw();if(!m||/<iframe/i.test(m)||/^https?:\/\//i.test(m)||mapCoords())return '';return m;}
function mapQuery(){return (mapText()||((settings.shop||'')+' '+(settings.address||''))).trim();}
function mapEmbed(){
  const m=mapRaw();
  const ifr=m.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);          // 1) dán nguyên mã nhúng
  if(ifr)return ifr[1];
  if(/^https?:\/\/(www\.)?google\.[^\/]+\/maps\/embed/i.test(m))return m; // 2) link nhúng sẵn
  const co=mapCoords();                                              // 3) toạ độ
  if(co)return 'https://maps.google.com/maps?q='+co+'&z=17&hl=vi&output=embed';
  return 'https://maps.google.com/maps?q='+encodeURIComponent(mapQuery())+'&z=16&hl=vi&output=embed'; // 5) chữ
}
function mapDir(){
  const m=mapRaw();
  // 4) link chia sẻ / place -> dùng thẳng để chỉ đường (không phải iframe/embed)
  if(/^https?:\/\//i.test(m)&&!/<iframe/i.test(m)&&!/\/maps\/embed/i.test(m))return m;
  const dest=mapCoords()||mapQuery();
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest);
}

// ----- Danh mục: hỗ trợ 1 SP thuộc NHIỀU danh mục (p.cats[]), tương thích ngược p.cat -----
function prodCats(p){return (p&&Array.isArray(p.cats)&&p.cats.length)?p.cats.filter(Boolean):(p&&p.cat?[p.cat]:[]);}
function prodCat(p){return prodCats(p)[0]||'';}
function inCat(p,c){return prodCats(p).includes(c);}

const COLORMAP={'nâu trầm':'#5b3a24','gỗ sồi':'#c89a5c','gỗ óc chó':'#4a3526','nâu óc chó':'#4a3526','gỗ tự nhiên':'#b0824c','ghi chì':'#6a6a6a','ghi':'#9a9a9a','xám':'#8a8a8a','trắng':'#f4f1ea','trắng kem':'#efe6d4','kem':'#e9dcc3','đen':'#222','nâu':'#6b4a30','xanh':'#7fa3a0','xanh rêu':'#6f7d5a','hồng':'#e3a7b1','vàng':'#d8b24a'};
function colorHex(name){const k=(name||'').toLowerCase().trim();if(COLORMAP[k])return COLORMAP[k];for(const key in COLORMAP){if(k.includes(key))return COLORMAP[key];}return '';}
function catCounts(){const c={__all:products.length,__none:0};cats.forEach(x=>c[x]=0);
  products.forEach(p=>{const pc=prodCats(p).filter(x=>cats.includes(x));if(pc.length)pc.forEach(x=>c[x]=(c[x]||0)+1);else c.__none++;});return c;}
function shopFiltered(){let l=products.slice();
  if(active==='__none')l=l.filter(p=>!prodCats(p).some(x=>cats.includes(x)));
  else if(active!=='__all')l=l.filter(p=>inCat(p,active));
  if(search){const s=search.toLowerCase();l=l.filter(p=>(p.name||'').toLowerCase().includes(s)||(p.sku||'').toLowerCase().includes(s));}
  return l;}

function catIconName(c){const k=(c||'').toLowerCase();
  if(/sofa|khách|phòng khách/.test(k))return 'sofa';if(/ngủ|giường|tủ quần/.test(k))return 'bed';

  if(/nệm/.test(k))return 'bed';if(/tủ|kệ/.test(k))return 'cabinet';return 'chair';}

function priceHTML(p){
  if(!settings.showPrice)return `<span class="now nodeal" style="font-size:15px;color:var(--muted)">Liên hệ báo giá</span>`;

    const vs=varPriced(p),prices=vs.map(varSell),mn=Math.min(...prices),mx=Math.max(...prices);
    const cheapest=vs.reduce((a,b)=>varSell(b)<varSell(a)?b:a);

    const from=mn!==mx?`<span class="pfrom">từ </span>`:'';
    return `${from}<span class="now ${hasSale?'':'nodeal'}">${fmt(mn)}</span>${hasSale?`<span class="old">${fmt(cheapest.price)}</span>`:''}`;

function pvars(p){return (p&&Array.isArray(p.variants))?p.variants:[];}
function hasVariants(p){return pvars(p).some(v=>v&&+v.price>0);}
function findVar(p,c,s){return pvars(p).find(v=>v&&(v.c||'')===(c||'')&&(v.s||'')===(s||''))||null;}
function varSell(v){return (v.sale&&+v.sale<+v.price)?+v.sale:+v.price;}
function varPriced(p){return pvars(p).filter(v=>v&&+v.price>0);}
function minVarPrice(p){const vs=varPriced(p);return vs.length?Math.min(...vs.map(varSell)):null;}
function maxVarPrice(p){const vs=varPriced(p);return vs.length?Math.max(...vs.map(varSell)):null;}
function varStockTotal(p){return pvars(p).reduce((s,v)=>s+(+v.stock||0),0);}
function prodColors(p){return (p.color||'').split(/\s*[\/,;|·\n]\s*/).map(s=>s.trim()).filter(Boolean);}
function prodSizes(p){return (p.sizeOpts||'').split(/\s*[\/,;|·\n]\s*/).map(s=>s.trim()).filter(Boolean);}
function getVariant(id){const p=prod(id);if(!p)return{color:'',size:''};
  const cs=prodColors(p),ss=prodSizes(p);
  let v=cartVariant[id];if(typeof v==='string')v={color:v};v=v||{};
  return {color: cs.includes(v.color)?v.color:(cs[0]||''), size: ss.includes(v.size)?v.size:(ss[0]||'')};}
function setVariant(id,patch){const v=getVariant(id);cartVariant[id]=Object.assign({},v,patch);saveCartVar();}
function variantStr(id){const v=getVariant(id);return [v.color,v.size].filter(Boolean).join(' · ');}

const ORDER_ST={cho:['Chờ xác nhận','#B6791F','#FBF0DA'],xac:['Đã xác nhận','#0068FF','#E9F0F8'],giao:['Đang giao','#7E5BEF','#EFEAFB'],xong:['✅ Hoàn thành','#2E7D52','#E7F3EC'],huy:['Đã hủy','#B23A2A','#F7DED9']};

let donSrc='all', donSt='all', cloudOrders=null, ordersCloudErr=null, donAll=[], donFocus='';
async function loadCloudOrders(){
  cloudOrders=null;ordersCloudErr=null;
  if(!DB.supaOn||!DB.client())return;
  try{const {data,error}=await DB.client().from('orders').select('*').order('created_at',{ascending:false});

// đơn 'cho' (chờ xử lý) cho badge trên tab
function pendCount(){

  const on=(cloudOrders||[]).filter(o=>(o.status||'cho')==='cho').length;

// chuẩn hóa 1 đơn (online = row cloud, quay = voucher ban) về cùng 1 dạng
function normOrder(store,o){
  const tot=+o.total||0,dep=+o.deposit||0;
  // đơn quầy (voucher bán) cũ KHÔNG có trạng thái = đã bán xong (đã trừ kho); đơn online mới = chờ xác nhận
  let st=o.status||(store==='online'?'cho':'xong'); if(st==='dat')st='cho';
  return {store,src:store,id:o.id,code:o.code,date:o.date||o.created_at,status:st,
    buyer:o.buyer||{},items:o.items||[],total:tot,deposit:dep,remain:(o.remain!=null?o.remain:tot-dep),
    deliver:o.deliver||(o.buyer&&o.buyer.deliver)||'',note:o.note||(o.buyer&&o.buyer.note)||'',paid:!!o.paid,xuatCode:o.xuatCode||'',
    stockDone:(o.stockDone!=null?!!o.stockDone:(st==='xong')),raw:o};
}
async function loadAllOrders(){
  await loadCloudOrders();
  const online=(cloudOrders||[]).map(o=>normOrder('online',o));
  const quay=vouchers.filter(v=>v.type==='ban'&&v.status!=='daban').map(v=>normOrder('quay',v));
  return online.concat(quay).sort((a,b)=>new Date(b.date)-new Date(a.date));
}
// tạo phiếu xuất tự động (trừ kho) khi hoàn thành đơn
function makeStockOut(code,items){
  const xi=items.map(i=>({id:i.id,sku:i.sku,name:i.name,qty:i.qty,price:(i.cost!=null?i.cost:((prod(i.id)||{}).cost||0))}));
  const total=xi.reduce((s,i)=>s+i.qty*i.price,0);
  items.forEach(i=>{const p=prod(i.id);if(p)p.stock-=i.qty;});
  const xv={id:uid(),code:'PX'+Date.now().toString().slice(-7),type:'xuat',date:new Date().toISOString(),
    partner:'Giao đơn '+code,note:'Tự động trừ kho khi hoàn thành đơn '+code,items:xi,total,staff:(session.staff&&session.staff.name)||'',auto:true,refOrder:code};
  vouchers.unshift(xv);return xv;
}
// hoàn kho (cộng lại) khi hủy đơn đã trừ kho
function makeStockIn(code,items){
  const ni=items.map(i=>({id:i.id,sku:i.sku,name:i.name,qty:i.qty,price:(i.cost!=null?i.cost:((prod(i.id)||{}).cost||0))}));
  const total=ni.reduce((s,i)=>s+i.qty*i.price,0);
  items.forEach(i=>{const p=prod(i.id);if(p)p.stock+=i.qty;});
  const nv={id:uid(),code:'PN'+Date.now().toString().slice(-7),type:'nhap',date:new Date().toISOString(),
    partner:'Hoàn kho hủy đơn '+code,note:'Tự động cộng lại kho khi hủy đơn '+code,items:ni,total,staff:(session.staff&&session.staff.name)||'',auto:true,refOrder:code};
  vouchers.unshift(nv);return nv;
}
async function saveOrderPatch(no,patch){

  if(no.store==='online'){
    const dbp={};if(patch.status!=null)dbp.status=patch.status;if(patch.buyer!=null)dbp.buyer=patch.buyer;
    if(patch.items!=null)dbp.items=patch.items;if(patch.total!=null)dbp.total=patch.total;
    if(Object.keys(dbp).length){try{await DB.client().from('orders').update(dbp).eq('id',no.id);}catch(e){toast('Lỗi lưu đơn online: '+(e.message||e));}}

}

  const short=no.items.filter(i=>{const p=prod(i.id);return p&&i.qty>p.stock;});
  if(short.length){const msg=short.map(i=>{const p=prod(i.id);return i.name+' (còn '+(p?p.stock:0)+', cần '+i.qty+')';}).join('; ');
    if(!await uiConfirm('Tồn không đủ','Vẫn hoàn thành & xuất kho (tồn có thể âm)?\n'+msg))return;}
  if(no.stockDone){if(!await uiConfirm('Đơn này đã trừ kho rồi','Vẫn hoàn thành nhưng KHÔNG trừ kho lần nữa?'))return;
    await saveOrderPatch(no,{status:'xong'});await saveV();toast('Đã đánh dấu hoàn thành (không trừ kho lại)');renderDon();return;}
  const xv=makeStockOut(no.code,no.items);await saveP();
  await saveOrderPatch(no,{status:'xong',xuatCode:xv.code,stockDone:true});await saveV();
  toast('Hoàn thành đơn '+no.code+' · đã xuất kho trừ tồn');renderDon();}
async function orderCancel(id){const no=donAll.find(o=>o.id===id);if(!no||no.status==='huy')return;

async function orderPayFull(id){const no=donAll.find(o=>o.id===id);if(!no)return;

async function orderDelete(id){const no=donAll.find(o=>o.id===id);if(!no)return;

async function eoSave(){
  const no=eoNo;if(!no)return;
  if(!eoLines.length){toast('Đơn phải có ít nhất 1 sản phẩm');return;}
  const name=$('#eoName').value.trim(),phone=$('#eoPhone').value.trim(),address=$('#eoAddr').value.trim(),
        deliver=$('#eoDeliver').value,note=$('#eoNote').value.trim();
  const newItems=eoLines.map(l=>{const net=eoLineNet(l),eff=l.qty?Math.round(net/l.qty):l.price,p=prod(l.id)||{};
    return{id:l.id,sku:l.sku,name:l.name,qty:l.qty,price:eff,listPrice:l.price,disc:l.price*l.qty-net,cost:p.cost};});
  const sub=eoSub(),lineD=eoLineDiscTotal(),after=eoAfter();
  const disc=Math.max(0,Math.min(after,+eoDisc||0));
  const total=round10(after-disc), deposit=Math.max(0,Math.min(total,+eoDeposit||0));

  if(no.stockDone){
    const oldQ={},newQ={};
    (no.items||[]).forEach(i=>oldQ[i.id]=(oldQ[i.id]||0)+(+i.qty||0));
    newItems.forEach(i=>newQ[i.id]=(newQ[i.id]||0)+(+i.qty||0));
    const outs=[],ins=[];
    Object.keys(Object.assign({},oldQ,newQ)).forEach(pid=>{const d=(newQ[pid]||0)-(oldQ[pid]||0);const p=prod(pid);
      if(!d||!p)return;const it={id:pid,sku:p.sku,name:p.name,qty:Math.abs(d),cost:p.cost};
      if(d>0)outs.push(it);else ins.push(it);});
    if(ins.length)makeStockIn(no.code+' (khách trả/bớt)',ins);
    if(outs.length)makeStockOut(no.code+' (giao thêm)',outs);
    if(ins.length||outs.length)await saveP();
  }
  const nb={name,phone,address};
  if(no.store==='online'){nb.note=note;nb.deliver=deliver;
    await saveOrderPatch(no,{buyer:nb,items:newItems,total});
    Object.assign(no.raw,{subtotal:sub,lineDisc:lineD,discount:disc,deposit,remain:total-deposit,paid:deposit>=total});
  } else {
    await saveOrderPatch(no,{buyer:nb,deliver,note,items:newItems,subtotal:sub,lineDisc:lineD,discount:disc,deposit,remain:total-deposit,paid:deposit>=total,total});
  }

    if(reg)Object.assign(reg,{name:name||reg.name,phone:phone||reg.phone,address:address||reg.address});
    else customers.push({id:uid(),name,phone,address,note:''});
    await saveCus();}
  closeOv();toast('Đã cập nhật đơn '+no.code);renderDon();
}

function prodOptions(){return products.map(p=>`<option value="${p.id}">${esc(p.name)} (tồn ${p.stock})</option>`).join('');}
function lineDiscAmt(price,qty,disc){disc=(disc==null?'':disc).toString().trim();const base=price*qty;if(!disc)return 0;
  if(/%$/.test(disc)){const p=parseFloat(disc);return isNaN(p)?0:Math.round(base*Math.max(0,Math.min(100,p))/100);}
  return Math.min(base,Math.max(0,parseFloat(disc.replace(/[^\d.]/g,''))||0));}
function lineBase(id){const p=prod(id);return sellPrice(p)*(+posCart[id].qty||0);}
function lineNet(id){const p=prod(id),l=posCart[id];const price=sellPrice(p);return price*(+l.qty||0)-lineDiscAmt(price,+l.qty||0,l.disc);}
function posSubtotal(){return Object.keys(posCart).filter(id=>prod(id)).reduce((s,id)=>s+lineBase(id),0);}
function posLineDisc(){return Object.keys(posCart).filter(id=>prod(id)).reduce((s,id)=>s+(lineBase(id)-lineNet(id)),0);}

function prodFromQR(raw){let id='';raw=(raw||'').trim();

  catch(e){msg.textContent='Không mở được camera. Hãy cấp quyền Camera cho trình duyệt rồi thử lại. ('+(e.name||e.message||'')+')';return;}
  vid.srcObject=stream;try{await vid.play();}catch(e){}
  msg.textContent='Đưa mã QR trên tem vào khung…';
  if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']});}catch(e){}}
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
  const handle=(raw)=>{if(!raw)return;const now=Date.now();if(raw===lastCode&&now-lastAt<1500)return;lastCode=raw;lastAt=now;
    const p=prodFromQR(raw);
    if(p){addPos(p.id);msg.style.color='#8CF2A6';msg.textContent='✓ Đã thêm: '+p.name;
      setTimeout(()=>{if(!stop){msg.style.color='';msg.textContent='Đưa mã QR tiếp theo vào khung…';}},1000);}
    else{msg.style.color='#FF9E8A';msg.textContent='Mã này không phải sản phẩm của shop';
      setTimeout(()=>{if(!stop){msg.style.color='';msg.textContent='Đưa mã QR trên tem vào khung…';}},1300);}};
  const tick=async()=>{if(stop)return;
    if(vid.readyState>=2){
      if(det){try{const cs=await det.detect(vid);if(cs&&cs[0])handle(cs[0].rawValue);}catch(e){}}
      else if(window.jsQR&&vid.videoWidth){canvas.width=vid.videoWidth;canvas.height=vid.videoHeight;ctx.drawImage(vid,0,0);
        try{const img=ctx.getImageData(0,0,canvas.width,canvas.height);const c=jsQR(img.data,img.width,img.height);if(c)handle(c.data);}catch(e){}}
    }
    raf=requestAnimationFrame(tick);};
  tick();
}

async function completeSale(kind){
  kind=(kind==='dat')?'dat':'ban';
  const ids=Object.keys(posCart).filter(id=>prod(id));if(!ids.length){toast('Chưa có sản phẩm trong đơn');return;}
  if(kind==='ban'){for(const id of ids){if(posCart[id].qty>prod(id).stock){toast('Tồn không đủ: '+prod(id).name+' (còn '+prod(id).stock+'). Dùng "Lưu đơn đặt hàng" nếu giao sau.');return;}}}
  const items=ids.map(id=>{const p=prod(id),list=sellPrice(p),qty=+posCart[id].qty,net=lineNet(id),eff=qty?Math.round(net/qty):list;
    return{id,sku:p.sku,name:p.name,qty,price:eff,listPrice:list,disc:list*qty-net,cost:p.cost};});
  const sub=ids.reduce((s,id)=>s+lineBase(id),0);
  const lineD=ids.reduce((s,id)=>s+(lineBase(id)-lineNet(id)),0);
  const afterLines=sub-lineD;
  const orderDisc=Math.max(0,Math.min(afterLines,+posInfo.disc||0));
  const total=round10(afterLines-orderDisc);// làm tròn tổng về hàng chục
  const deposit=Math.max(0,Math.min(total,+posInfo.deposit||0));
  const cus=[posInfo.name,posInfo.phone].filter(Boolean).join(' · ');
  const v={id:uid(),code:(kind==='dat'?'DH':'XB')+Date.now().toString().slice(-7),type:'ban',status:kind==='dat'?'cho':'xong',src:'quay',date:new Date().toISOString(),
    partner:cus||'Khách lẻ',pay:posInfo.pay,note:posInfo.note,
    buyer:{name:posInfo.name.trim(),phone:posInfo.phone.trim(),address:posInfo.addr.trim()},deliver:posInfo.deliver,
    subtotal:sub,lineDisc:lineD,discount:orderDisc,deposit,remain:total-deposit,paid:deposit>=total,stockDone:(kind==='ban'),items,total,staff:session.staff.name};
  vouchers.unshift(v);
  if(kind==='ban'){const xv=makeStockOut(v.code,v.items);v.xuatCode=xv.code;} // bán ngay -> xuất kho tự động
  await saveP();await saveV();
  posCart={};posInfo={name:'',phone:'',addr:'',deliver:'',pay:'Tiền mặt',note:'',disc:0,deposit:0};
  toast(kind==='dat'?('Đã lưu đơn đặt hàng '+v.code+' — xem/hoàn thành ở mục Đơn hàng'):('Đã bán · '+(deposit?'còn thu '+fmt(total-deposit):'thu '+fmt(total))));
  printVoucher(v);renderBan();
}

let khoSearch='', khoView='list', khoCat='__all', khoStock='all', khoSort='moi', khoEditing=false;
function khoList(){
  const kq=noAccent(khoSearch);
  const price=p=>(p.salePrice&&p.salePrice<p.price)?p.salePrice:p.price;
  let l=products.map((p,idx)=>({p,idx}));
  if(khoCat==='__none')l=l.filter(o=>!prodCats(o.p).length);
  else if(khoCat!=='__all')l=l.filter(o=>prodCats(o.p).includes(khoCat));
  if(khoStock==='con')l=l.filter(o=>o.p.stock>(o.p.min||0));
  else if(khoStock==='sap')l=l.filter(o=>o.p.stock>0&&o.p.stock<=(o.p.min||0));
  else if(khoStock==='het')l=l.filter(o=>o.p.stock<=0);
  if(kq)l=l.filter(o=>noAccent(o.p.name+' '+(o.p.sku||'')+' '+prodCats(o.p).join(' ')).includes(kq));
  const S={moi:(a,b)=>b.idx-a.idx,cu:(a,b)=>a.idx-b.idx,gia_cao:(a,b)=>price(b.p)-price(a.p),gia_thap:(a,b)=>price(a.p)-price(b.p),ton_it:(a,b)=>o1(a.p.stock)-o1(b.p.stock),ton_nhieu:(a,b)=>o1(b.p.stock)-o1(a.p.stock),ten:(a,b)=>(a.p.name||'').localeCompare(b.p.name||'','vi')};
  function o1(n){return +n||0;}
  l.sort(S[khoSort]||S.moi);
  return l.map(o=>o.p);
}

  el.innerHTML=cats.length?cats.map((c,i)=>`<div class="catmgr-item" data-i="${i}"><input class="nm" value="${esc(c)}"><span class="muted" style="font-size:12px;flex:0 0 64px;text-align:right">${cc[c]||0} SP</span><button class="mv" data-up title="Lên">↑</button><button class="mv" data-dn title="Xuống">↓</button><button class="dl" title="Xóa danh mục">×</button></div>`).join(''):'<p class="muted" style="font-size:13px;margin:0">Chưa có danh mục.</p>';}
function bindCatMgr(){
  const add=$('#catMgrAdd');if(add)add.onclick=async()=>{const n=await uiPrompt({title:'Danh mục mới',label:'Tên danh mục'});if(n&&n.trim()){const t=n.trim();if(!cats.includes(t)){cats.push(t);await saveCats();renderKho();}}};
  const el=$('#catMgrList');if(!el)return;
  el.querySelectorAll('.catmgr-item').forEach(row=>{
    const i=+row.dataset.i, old=cats[i];
    const nm=row.querySelector('.nm');
    nm.onchange=async()=>{const t=nm.value.trim();if(!t||t===old){nm.value=old;return;}
      if(cats.includes(t)&&t!==old){toast('Danh mục đã tồn tại');nm.value=old;return;}
      cats[i]=t;products.forEach(p=>{if(Array.isArray(p.cats))p.cats=p.cats.map(x=>x===old?t:x);if(p.cat===old)p.cat=t;});
      await saveCats();await saveP();toast('Đã đổi tên danh mục');renderKho();};
    row.querySelector('[data-up]').onclick=async()=>{if(i<=0)return;[cats[i-1],cats[i]]=[cats[i],cats[i-1]];await saveCats();renderKho();};
    row.querySelector('[data-dn]').onclick=async()=>{if(i>=cats.length-1)return;[cats[i+1],cats[i]]=[cats[i],cats[i+1]];await saveCats();renderKho();};
    row.querySelector('.dl').onclick=async()=>{if(!await uiConfirm('Xóa danh mục "'+old+'"?','Sản phẩm đang thuộc nhóm này sẽ bị gỡ khỏi nhóm (không xóa sản phẩm).'))return;
      cats.splice(i,1);products.forEach(p=>{if(Array.isArray(p.cats))p.cats=p.cats.filter(x=>x!==old);if(p.cat===old)p.cat=(prodCats(p)[0]||'');});
      await saveCats();await saveP();toast('Đã xóa danh mục');renderKho();};
  });}

function renderKGallery(){const g=$('#kGallery');if(!g)return;
  const imgs=window._kImgs||[];
  g.innerHTML=imgs.length?imgs.map((im,i)=>`<div class="g" draggable="true" data-idx="${i}"><img src="${esc(im)}">${i===0?'<span class="gmain">Ảnh chính</span>':''}<button class="del" data-gi="${i}">×</button></div>`).join(''):'<span class="hint">Chưa có ảnh — tải lên rồi kéo-thả để sắp xếp</span>';
  g.querySelectorAll('[data-gi]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();window._kImgs.splice(+b.dataset.gi,1);renderKGallery();});
  let dragI=null;
  g.querySelectorAll('.g').forEach(el=>{
    el.ondragstart=e=>{dragI=+el.dataset.idx;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragI));}catch(_){}};
    el.ondragend=()=>{dragI=null;g.querySelectorAll('.g').forEach(x=>x.classList.remove('dragging','dragover'));};
    el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('dragover');};
    el.ondragleave=()=>el.classList.remove('dragover');
    el.ondrop=e=>{e.preventDefault();const to=+el.dataset.idx;const from=dragI!=null?dragI:+(e.dataTransfer.getData('text/plain'));if(isNaN(from)||from===to)return;const a=window._kImgs;const m=a.splice(from,1)[0];a.splice(to,0,m);renderKGallery();};
  });}
/* ----- Bảng biến thể trong Kho: ma trận Màu × Kích thước ----- */
function kVarKey(c,s){return (c||'')+'␟'+(s||'');}
function kSplit(v){return (v||'').split(/\s*[\/,;|·\n]\s*/).map(s=>s.trim()).filter(Boolean);}
function kCombos(){const cs=kSplit($('#kColor')?$('#kColor').value:''),ss=kSplit($('#kSizeOpts')?$('#kSizeOpts').value:'');
  if(!cs.length&&!ss.length)return[];
  const C=cs.length?cs:[''],S=ss.length?ss:[''],out=[];C.forEach(c=>S.forEach(s=>out.push({c,s})));return out;}
function collectKVars(){window._kVars=window._kVars||{};
  document.querySelectorAll('#kVarBody tr[data-k]').forEach(tr=>{window._kVars[tr.dataset.k]={c:tr.dataset.c,s:tr.dataset.s,
    sku:(tr.querySelector('.kv-k').value||'').trim(),
    price:num(tr.querySelector('.kv-p').value),sale:num(tr.querySelector('.kv-s').value),stock:num(tr.querySelector('.kv-t').value)};});}
// Gợi ý mã con: mã cha + số trong tên kích thước/màu (VD GCS6T + "Ngang 62cm" -> GCS6T62)
function suggestSubSku(parent,c,s){
  parent=(parent||'').trim().toUpperCase();if(!parent)return '';
  const pick=t=>{const m=(t||'').match(/\d+/g);return m?m.join(''):(t||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);};
  const a=s?pick(s):'',b=(!s&&c)?pick(c):'';
  return parent+(a||b||'');
}
function renderKVar(){const wrap=$('#kVarBody');if(!wrap)return;const combos=kCombos();
  if(!combos.length){wrap.innerHTML='<p class="hint" style="margin:0">Nhập <b>Màu sắc</b> và/hoặc <b>Phân loại kích thước</b> ở trên rồi bấm <b>“Tạo bảng”</b>.</p>';return;}
  window._kVars=window._kVars||{};const m=window._kVars;
  const parent=($('#kSku')?$('#kSku').value:'').trim();
  wrap.innerHTML=`<div style="overflow-x:auto"><table class="kvartab"><thead><tr><th>Màu</th><th>Kích thước</th><th>Mã SP con</th><th>Giá bán</th><th>Giá KM</th><th>Tồn</th></tr></thead><tbody>${
    combos.map(({c,s})=>{const k=kVarKey(c,s),v=m[k]||{};
      return `<tr data-k="${esc(k)}" data-c="${esc(c)}" data-s="${esc(s)}"><td>${esc(c)||'—'}</td><td>${esc(s)||'—'}</td>
        <td><input class="kv-k" value="${esc(v.sku||'')}" placeholder="${esc(suggestSubSku(parent,c,s))}"></td>
        <td><input class="kv-p" inputmode="numeric" value="${v.price||''}"></td>
        <td><input class="kv-s" inputmode="numeric" value="${v.sale||''}"></td>
        <td><input class="kv-t" inputmode="numeric" value="${(v.stock!=null&&v.stock!=='')?v.stock:''}"></td></tr>`;}).join('')
  }</tbody></table>
  <button type="button" class="btn sm alt" id="kVarAutoSku" style="margin-top:8px">✨ Tự điền mã con theo mã cha</button></div>`;
  wrap.querySelectorAll('input').forEach(inp=>inp.oninput=collectKVars);
  const au=$('#kVarAutoSku');if(au)au.onclick=()=>{const par=($('#kSku')?$('#kSku').value:'').trim();
    if(!par){toast('Nhập Mã SP (mã cha) ở trên trước');return;}
    wrap.querySelectorAll('tr[data-k]').forEach(tr=>{const el=tr.querySelector('.kv-k');
      if(el&&!el.value.trim())el.value=suggestSubSku(par,tr.dataset.c,tr.dataset.s);});
    collectKVars();toast('Đã điền mã con');};}
async function saveKho(){
  const id=$('#kId').value,name=$('#kName').value.trim();if(!name){toast('Nhập tên sản phẩm');return;}
  // KHÔNG cho trùng mã SP
  const skuIn=$('#kSku').value.trim();
  if(skuIn){const dup=products.find(p=>p.id!==id&&(p.sku||'').trim().toLowerCase()===skuIn.toLowerCase());
    if(dup){toast('⚠ Mã SP "'+skuIn+'" đã dùng cho: '+dup.name+'. Hãy đổi mã khác.');
      const el=$('#kSku');if(el){el.focus();el.select&&el.select();el.style.borderColor='var(--sale)';el.style.background='#FCF3F1';}return;}}
  const selCats=kCatsVal();
  // Gom biến thể (chỉ giữ tổ hợp hợp lệ & có giá)
  collectKVars();const validK=new Set(kCombos().map(({c,s})=>kVarKey(c,s)));
  const variants=Object.entries(window._kVars||{}).filter(([k,v])=>validK.has(k)&&+v.price>0)
    .map(([k,v])=>({c:v.c,s:v.s,sku:(v.sku||'').trim(),price:+v.price||0,sale:(v.sale&&+v.sale<+v.price)?+v.sale:0,stock:+v.stock||0}));
  // Mã con được phép lặp trong CÙNG sản phẩm (vd cùng kích thước khác màu),
  // nhưng KHÔNG được trùng mã của sản phẩm khác.
  const subs=[...new Set(variants.map(v=>v.sku).filter(Boolean))];
  const clash=subs.find(s=>products.some(p=>p.id!==id&&((p.sku||'').toLowerCase()===s.toLowerCase()||(p.variants||[]).some(v=>(v.sku||'').toLowerCase()===s.toLowerCase()))));
  if(clash){toast('⚠ Mã SP con "'+clash+'" đã dùng ở sản phẩm khác');return;}
  const data={sku:$('#kSku').value.trim(),name,cats:selCats,cat:selCats[0]||'',unit:$('#kUnit').value.trim(),
    color:$('#kColor').value.trim(),sizeOpts:$('#kSizeOpts').value.trim(),material:$('#kMaterial').value.trim(),size:$('#kSize').value.trim(),
    cost:num($('#kCost').value),price:num($('#kPrice').value),salePrice:num($('#kSale').value),

let tagMode='base', giftStickers=[], tagSize='sm';
function productURL(p){return location.origin+location.pathname+'?p='+encodeURIComponent(p.id);}

function lblSale(p,scar){

function seg7(){return `<svg class="seg7" viewBox="0 0 54 100" aria-hidden="true">`
  +`<rect class="sg" x="12" y="3" width="30" height="9" rx="4"/>`   // a trên
  +`<rect class="sg" x="3" y="12" width="9" height="34" rx="4"/>`   // f trái trên
  +`<rect class="sg" x="42" y="12" width="9" height="34" rx="4"/>`  // b phải trên

  +`<rect class="sg" x="3" y="54" width="9" height="34" rx="4"/>`   // e trái dưới
  +`<rect class="sg" x="42" y="54" width="9" height="34" rx="4"/>`  // c phải dưới
  +`<rect class="sg" x="12" y="88" width="30" height="9" rx="4"/>`  // d dưới
  +`</svg>`;}
function lblPromo(c){
  const n=Math.max(1,Math.min(5,c.digits||5)); const cells=[];
  const dw=n<=3?17:(n===4?15.5:13.5); // bề rộng 1 chữ số (mm) — ít số thì to hơn cho lấp đầy tem
  for(let i=0;i<n;i++){cells.push('<span class="seg7cell">'+seg7()+'</span>');
    if(c.dot&&i<n-1&&(n-1-i)%3===0)cells.push('<span class="seg7dot">.</span>');}
  return `<div class="ntstk ntpromo"><div class="ntpromo-in">
    <div class="pmhead">${esc(c.title||'GIÁ KHUYẾN MÃI')}</div>
    <div class="seg7row" style="--dw:${dw}mm">${cells.join('')}${c.suffix?`<span class="seg7suf">${esc(c.suffix)}</span>`:''}</div>

function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();
  // scalable: dùng viewBox -> co giãn khít khung không lẻ pixel; crispEdges: tắt khử răng cưa -> cạnh ô QR đanh nét khi in
  let svg=q.createSvgTag({cellSize:8,margin:1,scalable:true});
  svg=svg.replace(/<svg /,'<svg shape-rendering="crispEdges" ');
  return svg;}catch(e){return '';}}

const POSCELLS=[['top','left'],['top','center'],['top','right'],['center','left'],['center','center'],['center','right'],['bottom','left'],['bottom','center'],['bottom','right']];
function ghCur(){return window._gh[window._gd||'desktop'];}
function gdPreview(){
  const raw=ghCur();const el=$('#gdPrev');if(!el)return;
  const mob=(window._gd==='mobile');
  // GIỐNG HỆT hiển thị thật: điện thoại chưa có ảnh riêng -> mượn ảnh máy tính
  const borrow=(mob && !raw.image && window._gh.desktop.image);
  const gh=borrow?Object.assign({},raw,{image:window._gh.desktop.image,imgPos:window._gh.desktop.imgPos,imgZoom:window._gh.desktop.imgZoom}):raw;
  el.style.maxWidth=mob?'380px':'';el.style.margin=mob?'0 auto 10px':'0 0 10px';
  if(gh.image&&!heroHasText(gh)){el.className='herofull';el.style.minHeight='';el.innerHTML=`<img src="${esc(gh.image)}" alt="">`;return;}
  el.style.minHeight='';
  el.className=`hero gdmini${gh.image?' has-img':''}${heroHasText(gh)?' has-text':''} v-${gh.valign||'bottom'} h-${gh.halign||'left'}`;
  el.innerHTML=heroBgHTML(gh)+`<div class="hero-inner">${heroInner(gh,{preview:true})}</div>`;
  if(!borrow)bindGdDrag();
}
function bindGdDrag(){
  const el=$('#gdPrev');if(!el)return;const img=el.querySelector('.hero-bg');if(!img)return;
  let drag=false,sx,sy,px,py;
  const cur=()=>{const p=(ghCur().imgPos||'50% 50%').split(' ').map(parseFloat);return{x:isNaN(p[0])?50:p[0],y:isNaN(p[1])?50:p[1]};};
  img.onpointerdown=e=>{drag=true;el.style.cursor='grabbing';sx=e.clientX;sy=e.clientY;const c=cur();px=c.x;py=c.y;try{img.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();};
  img.onpointermove=e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    const nx=Math.min(100,Math.max(0,px-dx/el.clientWidth*100)), ny=Math.min(100,Math.max(0,py-dy/el.clientHeight*100));
    ghCur().imgPos=Math.round(nx)+'% '+Math.round(ny)+'%';img.style.objectPosition=ghCur().imgPos;};
  const stop=()=>{drag=false;el.style.cursor='grab';};img.onpointerup=stop;img.onpointercancel=stop;
}

    </tbody></table></div>`;
  $('#addStaff').onclick=()=>editStaff(null);

function editStaff(id){
  const s=id?staff.find(x=>x.id===id):{name:'',email:'',role:'NV bán hàng',perms:permObj(ROLE_PRESET['NV bán hàng']),active:true};
  const cur=JSON.parse(JSON.stringify(s.perms||{}));
  $('#ovContent').innerHTML=`<div class="mbody">
    <h2 style="margin-bottom:14px">${id?'Sửa nhân viên':'Thêm nhân viên'}</h2>
    <div class="setrow"><label>Họ tên *</label><input id="sName" value="${esc(s.name)}"></div>
    <div class="row"><div class="setrow"><label>Email đăng nhập *</label><input id="sEmail" type="email" value="${esc(s.email||'')}" ${id?'readonly style="background:var(--cream);color:var(--muted)"':''} placeholder="email@..."></div>
      <div class="setrow"><label>Trạng thái</label><select id="sActive"><option value="1" ${s.active!==false?'selected':''}>Hoạt động</option><option value="0" ${s.active===false?'selected':''}>Tạm khóa</option></select></div></div>
    ${id?'':`<div class="setrow"><label>Mật khẩu (≥ 6 ký tự) *</label><input id="sPass" type="text" value="" placeholder="đặt mật khẩu cho nhân viên"></div>`}
    <label>Vai trò (bấm để áp quyền gợi ý)</label>
    <div class="roletabs" id="roletabs">${Object.keys(ROLE_PRESET).map(r=>`<button class="roletab ${r===s.role?'on':''}" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
    <label style="margin-top:6px">Quyền chi tiết (tùy chỉnh tự do)</label>
    <div class="permgrid" id="permgrid">${PERMS.map(([k,l])=>`<label class="permrow"><input type="checkbox" data-p="${k}" ${cur[k]?'checked':''}><span class="pn">${esc(l)}</span></label>`).join('')}</div>
    <div class="row" style="margin-top:16px"><button class="btn" id="sSave">Lưu nhân viên</button><button class="btn alt" id="sCancel" style="flex:0 0 110px">Hủy</button></div>
    ${id?'<p class="hint">Mật khẩu do nhân viên tự đổi (tab Cài đặt sau khi đăng nhập).</p>':''}
  </div>`;
  $('#ov').classList.add('show');
  let role=s.role;
  $('#roletabs').querySelectorAll('.roletab').forEach(b=>b.onclick=()=>{
    role=b.dataset.r;$('#roletabs').querySelectorAll('.roletab').forEach(x=>x.classList.toggle('on',x===b));
    const preset=ROLE_PRESET[role];$('#permgrid').querySelectorAll('[data-p]').forEach(c=>c.checked=preset.includes(c.dataset.p));
  });
  $('#sCancel').onclick=closeOv;
  $('#sSave').onclick=async()=>{
    const name=$('#sName').value.trim();
    if(!name){toast('Nhập họ tên');return;}
    const perms={};$('#permgrid').querySelectorAll('[data-p]').forEach(c=>perms[c.dataset.p]=c.checked);
    if(id){
      const t=staff.find(x=>x.id===id);Object.assign(t,{name,role,active:$('#sActive').value==='1',perms});
      await saveStaff();closeOv();toast('Đã lưu nhân viên');renderNhanvien();
      if(session.staff&&id===session.staff.id){session.staff=t;renderTabs();renderView();}
    }else{
      const email=$('#sEmail').value.trim().toLowerCase();const pass=$('#sPass').value;
      if(!/.+@.+\..+/.test(email)){toast('Nhập email hợp lệ');return;}
      if(staff.some(x=>x.email&&x.email.toLowerCase()===email)){toast('Email này đã có nhân viên');return;}
      if(pass.length<6){toast('Mật khẩu tối thiểu 6 ký tự');return;}
      toast('Đang tạo tài khoản...');
      const {error}=await DB.signUpAux(email,pass);
      if(error){toast('Lỗi: '+(/registered|exist/i.test(error.message)?'Email đã được đăng ký':error.message));return;}
      staff.push({id:uid(),email,name,role,active:$('#sActive').value==='1',perms});
      await saveStaff();closeOv();toast('Đã thêm nhân viên');renderNhanvien();
    }
  };
}

$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();

    if(d.products){products=d.products;cats=d.cats||cats;vouchers=d.vouchers||[];orders=d.orders||[];staff=d.staff||staff;customers=d.customers||customers;settings=Object.assign({},DEFSET,d.settings||settings);

// Nhập danh sách sản phẩm (.json) — GỘP theo mã SP, không xóa dữ liệu khác
$('#fileProducts').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{
    let arr=JSON.parse(r.result);if(arr&&arr.products)arr=arr.products;
    if(!Array.isArray(arr)){toast('File phải là danh sách sản phẩm');return;}
    let added=0,updated=0,newCats=0;
    arr.forEach(it=>{
      if(!it||!it.name)return;
      const icats=(Array.isArray(it.cats)&&it.cats.length?it.cats:(it.cat?[it.cat]:[])).map(c=>String(c).trim()).filter(Boolean);
      const data={sku:(it.sku||'').trim(),name:String(it.name).trim(),cats:icats,cat:icats[0]||'',unit:(it.unit||'Cái').trim(),
        color:(it.color||'').trim(),sizeOpts:(it.sizeOpts||'').trim(),material:(it.material||'').trim(),size:(it.size||'').trim(),
        cost:num(it.cost),price:num(it.price),salePrice:num(it.salePrice),minPrice:num(it.minPrice),
        stock:(it.stock!=null?(it.byArea?numDec(it.stock):num(it.stock)):99),min:(it.min!=null?num(it.min):0),desc:(it.desc||'').trim(),
        premium:!!it.premium,hot:!!it.hot,custom:!!it.custom,byArea:!!it.byArea,images:Array.isArray(it.images)?it.images:[]};
      icats.forEach(c=>{if(!cats.includes(c)){cats.push(c);newCats++;}});
      const ex=data.sku?products.find(p=>(p.sku||'').toLowerCase()===data.sku.toLowerCase()):null;
      if(ex){Object.assign(ex,data,{images:(data.images.length?data.images:ex.images)});updated++;}
      else{products.push({id:uid(),...data});added++;}
    });
    await saveP();if(newCats)await saveCats();
    toast('Đã nhập: +'+added+' mới, '+updated+' cập nhật'+(newCats?', '+newCats+' danh mục':''));
    renderKho();
  }catch(err){toast('Không đọc được file: '+err.message);}};r.readAsText(f);e.target.value='';};

/* ====================== UPLOAD ẢNH ====================== */
// Nén ảnh -> Blob (nhẹ hơn base64 nhiều)
function resizeImg(file,max,cb){const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>cb(b),'image/jpeg',0.8);};img.src=url;}
// Đẩy ảnh lên kho Supabase Storage -> trả về link công khai
async function uploadImg(blob,prefix){
  if(!DB.supaOn||!DB.client())throw new Error('Chưa kết nối máy chủ');
  const name=prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.jpg';
  const {error}=await DB.client().storage.from('img').upload(name,blob,{contentType:'image/jpeg',upsert:true});
  if(error)throw error;
  return DB.client().storage.from('img').getPublicUrl(name).data.publicUrl;
}
$('#fileGallery').onchange=e=>{const files=[...e.target.files];if(!files.length)return;window._kImgs=window._kImgs||[];
  let done=0,ok=0;toast('Đang tải '+files.length+' ảnh lên...');
  files.forEach(f=>resizeImg(f,1000,async b=>{
    try{window._kImgs.push(await uploadImg(b,'p/up'));ok++;}catch(err){toast('Lỗi tải ảnh: '+(err.message||err));}
    if(++done===files.length){renderKGallery();if(ok)toast('Đã tải '+ok+' ảnh lên kho');}
  }));e.target.value='';};
$('#fileBanner').onchange=e=>{const f=e.target.files[0];if(!f)return;const mob=(window._gd==='mobile');
  toast('Đang tải ảnh bìa...');
  resizeImg(f,mob?1200:1600,async b=>{
    let d;try{d=await uploadImg(b,'s/banner');}catch(err){toast('Lỗi tải ảnh: '+(err.message||err));return;}

    gdPreview();toast('Đã tải ảnh — kéo để chỉnh vị trí rồi bấm Lưu');});e.target.value='';};
$('#fileLogo').onchange=e=>{const f=e.target.files[0];if(!f)return;resizeImg(f,600,async b=>{
